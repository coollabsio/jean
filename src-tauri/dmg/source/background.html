<!doctype html>
<!--
  Source for the macOS DMG installer background (src-tauri/dmg/background.tiff).
  Render with: bun run dmg:background
  Layout must match bundle.macOS.dmg in tauri.conf.json:
  window 660x400, app icon at (180, 210), Applications at (480, 210),
  icon size 128, label text size 16 (bundle_dmg defaults).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist Sans';
        src: url('./geist-sans-variable.woff2') format('woff2');
        font-weight: 100 900;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 660px;
        height: 400px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: 'Geist Sans', sans-serif;
        background: #101010;
        color: #fafafa;
      }

      .title {
        position: absolute;
        top: 58px;
        width: 100%;
        text-align: center;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .subtitle {
        position: absolute;
        top: 92px;
        width: 100%;
        text-align: center;
        font-size: 13px;
        color: #a1a1a1;
      }

      .arrow {
        position: absolute;
        top: 202px;
        left: 290px;
      }

      /* Pills keep Finder labels readable in light and dark mode */
      .pill {
        position: absolute;
        top: 278px;
        height: 26px;
        border-radius: 13px;
        transform: translateX(-50%);
        background: #5a5a5a;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Install Jean</h1>
    <p class="subtitle">Drag Jean to the Applications folder</p>

    <svg
      class="arrow"
      width="80"
      height="16"
      viewBox="0 0 80 16"
      aria-hidden="true"
    >
      <path
        d="M 1 8 H 78 M 71 1 L 78 8 L 71 15"
        fill="none"
        stroke="#a1a1a1"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <div class="pill" style="left: 180px; width: 72px"></div>
    <div class="pill" style="left: 480px; width: 124px"></div>
  </body>
</html>
