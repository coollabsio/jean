<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Jean" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101010" />
    <script>
      ;(() => {
        let savedTheme = 'system'
        try {
          savedTheme = localStorage.getItem('ui-theme') || 'system'
        } catch {
          // Fall back to the OS theme when storage is unavailable.
        }
        const resolvedTheme =
          savedTheme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : savedTheme
        document.documentElement.classList.add(resolvedTheme)
        document.documentElement.style.colorScheme = resolvedTheme

        // Apply the active custom theme before the first paint. Mirrors
        // applyThemeColours in src/lib/custom-themes.ts; theme-boot.test.ts
        // keeps the two in sync.
        try {
          const tokens =
            'background foreground card card-foreground popover popover-foreground primary primary-foreground secondary secondary-foreground muted muted-foreground accent accent-foreground destructive warning warning-foreground success success-foreground info info-foreground border input ring chart-1 chart-2 chart-3 chart-4 chart-5 sidebar sidebar-foreground sidebar-primary sidebar-primary-foreground sidebar-accent sidebar-accent-foreground sidebar-border sidebar-ring toast-background toast-border'.split(
              ' '
            )
          const prefs = JSON.parse(
            localStorage.getItem('jean-client-preferences-v1') || 'null'
          )
          const themes = Array.isArray(prefs?.custom_themes)
            ? prefs.custom_themes
            : []
          const colours = themes.find(t => t?.id === prefs.custom_theme)?.[
            resolvedTheme
          ]
          for (const token of tokens) {
            const colour = colours?.[token]
            if (typeof colour === 'string' && colour) {
              document.documentElement.style.setProperty('--' + token, colour)
            }
          }
        } catch {
          // ThemeProvider applies the theme once React mounts.
        }
      })()
    </script>
    <title>Jean</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
