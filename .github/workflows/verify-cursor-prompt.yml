name: Verify Cursor prompt

on:
  push:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './jean-core -> target'
          shared-key: verify-cursor-prompt

      - name: Cursor tests
        run: cargo test --manifest-path jean-core/Cargo.toml chat::cursor::tests -- --nocapture
